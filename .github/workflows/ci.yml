name: Update game data

on:
  schedule:
    # Run at 16:00 UTC+8 every Tuesday (08:00 UTC)
    - cron: "0 8 * * 2"
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force release"
        default: false
        type: boolean
      allow_missing_remote_version:
        description: "Allow CI update to continue without a remote version baseline"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ixion-game-data-update
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.observe.outputs.sha }}
      update_required: ${{ steps.observe.outputs.update_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install without native build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build observation dependencies
        run: pnpm --filter '@ffcafe/ixion-server...' build
      - name: Observe and commit versions
        id: observe
        run: pnpm status --commit

  update-exd-schema:
    needs: observe
    if: needs.observe.outputs.update_required == 'true' || inputs.force_release
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.observe.outputs.sha }}
          submodules: true

      - name: Update EXDSchema submodule
        run: |
          git -C lib/EXDSchema fetch --depth=1 origin \
            +refs/heads/latest:refs/remotes/origin/latest
          git submodule update --remote -- lib/EXDSchema

          if git diff --quiet -- lib/EXDSchema; then
            echo "EXDSchema is already up to date"
          else
            git config user.name "FFCAFE Automation"
            git config user.email "actions@github.com"
            git add lib/EXDSchema
            git commit -m "chore: update EXDSchema"
            git push origin HEAD:main
          fi

      - name: Record source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: update-exd-schema
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.update-exd-schema.outputs.sha }}

  update:
    needs: [build, update-exd-schema]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ci update commits released versions and tags releases in this checkout.
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-exd-schema.outputs.sha }}

      - name: Track main for version commits
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git checkout -B main
          git branch --set-upstream-to=origin/main main

      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: ixion-cli

      - name: Extract CLI artifact
        run: tar -xf ixion-cli.tar

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run CI update command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_PREFIX: ${{ secrets.MINIO_PREFIX }}
          FORCE_RELEASE: ${{ inputs.force_release && '--force-release' || '' }}
          ALLOW_MISSING_REMOTE_VERSION: ${{ inputs.allow_missing_remote_version && '--allow-missing-remote-version' || '' }}
        run: |
          node packages/cli/dist/index.js ci init
          node packages/cli/dist/index.js ci update ${{ env.FORCE_RELEASE }} ${{ env.ALLOW_MISSING_REMOTE_VERSION }}

  update-xivstrings:
    runs-on: ubuntu-latest
    needs: [update, update-exd-schema]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-exd-schema.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Trigger xivstrings update
        env:
          XIVSTRINGS_ROOT: ${{ secrets.XIVSTRINGS_ROOT }}
          XIVSTRINGS_UPDATE_TOKEN: ${{ secrets.XIVSTRINGS_UPDATE_TOKEN }}
        run: node scripts/trigger-xivstrings-update.mjs

  datamining-cn:
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ixion-cli

      - name: Extract CLI artifact
        run: tar -xf ixion-cli.tar

      - uses: actions/checkout@v5
        with:
          repository: thewakingsands/ffxiv-datamining-cn
          path: ffxiv-datamining-cn
          ssh-key: ${{ secrets.SSH_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run datamining command
        id: export-csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_PREFIX: ${{ secrets.MINIO_PREFIX }}
        run: |
          node packages/cli/dist/index.js ci init
          node packages/cli/dist/index.js exd export-csv ffxiv-datamining-cn -s sdo --crlf

      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          cwd: ffxiv-datamining-cn
          default_author: github_actions
          author_name: FFCAFE Automation
          message: "ver ${{ steps.export-csv.outputs.version }}"
          tag: "ver-${{ steps.export-csv.outputs.version }} --force"
          tag_push: "--force"

  datamining-cn-exd-schema:
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ixion-cli

      - name: Extract CLI artifact
        run: tar -xf ixion-cli.tar

      - name: Checkout datamining-cn
        uses: actions/checkout@v5
        with:
          repository: thewakingsands/ffxiv-datamining-cn
          path: ffxiv-datamining-cn
          ssh-key: ${{ secrets.SSH_KEY }}

      - name: Checkout exd-schema branch
        working-directory: ffxiv-datamining-cn
        run: |
          if git fetch origin exd-schema:refs/remotes/origin/exd-schema; then
            git checkout -B exd-schema origin/exd-schema
            git branch --set-upstream-to=origin/exd-schema exd-schema
          else
            git checkout -b exd-schema
            git push --set-upstream origin exd-schema
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Export CSV with EXDSchema
        id: export-csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_PREFIX: ${{ secrets.MINIO_PREFIX }}
        run: |
          node packages/cli/dist/index.js ci init
          node packages/cli/dist/index.js exd export-csv ffxiv-datamining-cn -s sdo --crlf --exd-schema lib/EXDSchema --skip-first-line

      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          cwd: ffxiv-datamining-cn
          default_author: github_actions
          author_name: FFCAFE Automation
          message: "EXDSchema ver ${{ steps.export-csv.outputs.version }}"

  datamining-tc:
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ixion-cli

      - name: Extract CLI artifact
        run: tar -xf ixion-cli.tar

      - uses: actions/checkout@v5
        with:
          repository: thewakingsands/ffxiv-datamining-tc
          path: ffxiv-datamining-tc
          ssh-key: ${{ secrets.SSH_KEY_TC }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run datamining command
        id: export-csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET_NAME: ${{ secrets.MINIO_BUCKET_NAME }}
          MINIO_PREFIX: ${{ secrets.MINIO_PREFIX }}
        run: |
          node packages/cli/dist/index.js ci init
          node packages/cli/dist/index.js exd export-csv ffxiv-datamining-tc -s userjoy --crlf

      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          cwd: ffxiv-datamining-tc
          default_author: github_actions
          author_name: FFCAFE Automation
          message: "ver ${{ steps.export-csv.outputs.version }}"
          tag: "ver-${{ steps.export-csv.outputs.version }} --force"
          tag_push: "--force"
