name: Observe client versions

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ixion-region-status
  cancel-in-progress: false

jobs:
  status:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Install without native build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build observation dependencies
        run: pnpm --filter '@ffcafe/ixion-server...' build
      - name: Observe and publish
        env:
          STATUS_S3_ENDPOINT: ${{ vars.STATUS_S3_ENDPOINT }}
          STATUS_S3_REGION: ${{ vars.STATUS_S3_REGION }}
          STATUS_S3_BUCKET: ${{ vars.STATUS_S3_BUCKET }}
          STATUS_S3_KEY: ${{ vars.STATUS_S3_KEY }}
          STATUS_S3_FORCE_PATH_STYLE: ${{ vars.STATUS_S3_FORCE_PATH_STYLE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATUS_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATUS_S3_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.STATUS_S3_SESSION_TOKEN }}
        run: pnpm status --publish
